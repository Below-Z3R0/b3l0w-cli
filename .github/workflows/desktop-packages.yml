name: desktop-packages

on:
  workflow_dispatch:

# El tag se calcula con run_number: es único y no depende de outputs
# entre jobs (un output vacío hacía fallar `gh release create`).
env:
  TAG: desktop-${{ github.run_number }}

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  # Paquetes que necesitan makepkg: compilan dentro de un contenedor Arch.
  # Nada se compila en la máquina del mantenedor.
  build-arch:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build in Arch
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -e TAG="$TAG" \
            archlinux:base-devel bash -euxo pipefail -c '
              pacman -Syu --noconfirm --needed git sudo namcap devtools
              useradd -m builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
              chown -R builder:builder /work/packaging
              for pkg in \
                xdg-desktop-portal-umbriel-b3l0w \
                umbriel-b3l0w \
                noctalia-b3l0w \
                b3l0w-calamares \
                vkbasalt \
                millennium-bin; do
                echo "==> $pkg"
                case "$pkg" in
                  # millennium-bin solo descarga el tar.gz upstream y lo
                  # empaqueta: no compila, así que no necesita resolver
                  # las deps (entre ellas steam, que vive en multilib).
                  millennium-bin)
                    su builder -c "cd /work/packaging/$pkg && makepkg -f --noconfirm --nodeps"
                    ;;
                  *)
                    su builder -c "cd /work/packaging/$pkg && makepkg -s --noconfirm --needed"
                    ;;
                esac
                namcap /work/packaging/$pkg/*.pkg.tar.zst || true
                if [ "$pkg" = "xdg-desktop-portal-umbriel-b3l0w" ]; then
                  pacman -U --noconfirm /work/packaging/$pkg/*.pkg.tar.zst
                fi
              done
              mkdir -p /work/dist
              find /work/packaging -name "*.pkg.tar.zst" ! -name "*-debug-*" -exec cp {} /work/dist/ \;
              # GitHub artifacts and release assets reject ':'; the epoch stays
              # inside .PKGINFO, only the filename changes.
              for f in /work/dist/*.pkg.tar.zst; do
                clean="$(echo "$f" | tr ':' '_')"
                [ "$f" = "$clean" ] || mv "$f" "$clean"
              done
              chmod -R a+r /work/dist
            '

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arch-packages
          path: dist/*.pkg.tar.zst

  # Paquetes cuyo upstream ya publica .pkg.tar.zst. Solo se verifica el
  # SHA256 del release y se pasa el archivo tal cual: no se recompila.
  build-prebuilt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Heronite
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tag=$(gh release view --repo RafaelGoulartB/Heronite --json tagName -q .tagName)
          ver="${tag#v}"
          asset="heronite-${ver}-1-x86_64.pkg.tar.zst"
          url="https://github.com/RafaelGoulartB/Heronite/releases/download/${tag}"
          curl -fsSLO "${url}/${asset}"
          curl -fsSL "${url}/SHA256SUMS" -o SHA256SUMS
          grep " ${asset}\$" SHA256SUMS | sha256sum -c -
          mv "${asset}" dist/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prebuilt-packages
          path: dist/*.pkg.tar.zst

  release:
    needs: [build-arch, build-prebuilt]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "*-packages"
          merge-multiple: true
          path: dist

      - name: Manifest
        env:
          TAG: ${{ env.TAG }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libarchive-tools
          python3 - <<'PY'
          import glob, hashlib, json, os, re, subprocess
          tag = os.environ["TAG"]
          repo = os.environ["GH_REPO"]
          packages = {}
          for path in sorted(glob.glob("dist/*.pkg.tar.zst")):
              info = subprocess.check_output(["bsdtar", "-xOf", path, ".PKGINFO"], text=True)
              fields = {}
              for line in info.splitlines():
                  if "=" in line:
                      k, v = line.split("=", 1)
                      fields[k.strip()] = v.strip()
              name = fields.get("pkgname") or os.path.basename(path).split("-")[0]
              version = fields.get("pkgver", "0")
              commit = ""
              m = re.search(r"(?:g|\.)([0-9a-f]{7,9})(?:-\d+)?$", version)
              if m:
                  commit = m.group(1)
              sha = hashlib.sha256(open(path, "rb").read()).hexdigest()
              packages[name] = {
                  "version": version,
                  "commit": commit,
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{os.path.basename(path)}",
                  "sha256": sha,
              }
          with open("dist/manifest.json", "w") as fh:
              json.dump({"release": tag, "packages": packages}, fh, indent=2, sort_keys=True)
          PY
          cat dist/manifest.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.TAG }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/*.pkg.tar.zst dist/manifest.json \
            --repo "$REPO" \
            --title "Desktop packages $TAG" \
            --notes "Noctalia, Umbriel, el portal, Calamares, vkBasalt, Millennium y Heronite. Construido en runners; la firma se hace en local antes de publicar en [b3l0w]."

      # El release queda publicado pero [b3l0w] todavía sirve la versión
      # vieja hasta que alguien firme y suba los paquetes. Este paso
      # abre un issue para que GitHub notifique.
      - name: Avisar que falta publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.TAG }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          faltan=0
          for asset in $(gh release view "$TAG" --repo "$REPO" --json assets \
              --jq '.assets[].name | select(endswith(".pkg.tar.zst"))'); do
            if ! curl -fsI "https://raw.githubusercontent.com/Below-Z3R0/b3l0w-packages/main/x86_64/$asset" >/dev/null; then
              echo "falta: $asset"
              faltan=$((faltan + 1))
            fi
          done
          if [ "$faltan" -eq 0 ]; then
            echo "todo publicado en [b3l0w]"
            exit 0
          fi
          if [ "$(gh issue list --repo "$REPO" --state open \
              --search "$TAG in:title" --json number --jq 'length')" -gt 0 ]; then
            echo "ya hay un issue abierto para $TAG"
            exit 0
          fi
          gh issue create --repo "$REPO" \
            --title "📦 $TAG: falta firmar y publicar en [b3l0w]" \
            --body "El release $TAG se publicó, pero $faltan paquete(s) no están en [b3l0w]. Mientras no se publique, pacman -S sigue sirviendo la versión anterior.

          En local:

              cd ~/Documents/Github/b3l0w-cli
              bash ~/Documents/Manteiner/release/repo-sync.sh --push"
